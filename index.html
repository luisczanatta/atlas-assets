<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escáner de Rondines</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--brand:#7b135f;--brand2:#95156f;--bg:#f3f3f6;--ok:#176537;--warn:#856300;--bad:#8f211b}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff}
.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:20px}
.top .small{font-size:12px;opacity:.85}.top h1{font-size:23px;margin:4px 0}
.content{padding:15px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f5f5f8;border-radius:15px;padding:12px;text-align:center}
.metric .n{font-size:27px;font-weight:bold}.metric .t{font-size:11px;color:#777}
#reader{width:100%;min-height:330px;background:#111;border-radius:18px;overflow:hidden}
#reader video{object-fit:cover!important}
.msg{padding:12px;border-radius:14px;margin-top:12px;background:#f3f3f5;line-height:1.4;font-size:14px}
.msg.ok{background:#eaf7ef;color:var(--ok)}.msg.warn{background:#fff6d8;color:var(--warn)}.msg.bad{background:#fdeceb;color:var(--bad)}
.last{margin-top:13px;border-top:1px solid #eee;padding-top:13px}.last b{font-size:18px;display:block;margin-top:4px}
button{width:100%;min-height:54px;border:0;border-radius:15px;font-size:16px;font-weight:bold}
.finish{background:var(--brand);color:#fff}.cancel{margin-top:10px;background:#eee;color:#444}
.footer{text-align:center;color:#999;font-size:12px;padding:8px 0 22px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="small">RONDÍN EN CURSO</div>
    <h1 id="guardia">—</h1>
    <div id="sessionTxt" class="small"></div>
  </div>
  <div class="content">
    <div class="card">
      <div class="stats">
        <div class="metric"><div id="contador" class="n">0</div><div class="t">LECTURAS</div></div>
        <div class="metric"><div id="tiempo" class="n">00:00</div><div class="t">TIEMPO</div></div>
      </div>
    </div>
    <div class="card">
      <div id="reader"></div>
      <div id="estado" class="msg">Preparando cámara...</div>
      <div class="last">
        <span style="font-size:12px;color:#777">ÚLTIMO QR</span>
        <b id="ultimo">Sin lecturas</b>
        <span id="ultimoHora" style="font-size:13px;color:#777">—</span>
      </div>
    </div>
    <div class="card">
      <button class="finish" onclick="finalizar()">FINALIZAR RONDÍN</button>
      <button class="cancel" onclick="cancelar()">CANCELAR</button>
    </div>
    <div class="footer">Desarrollado por Luis Zanatta</div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
const CFG = {
  session: qs.get('session') || '',
  guardiaId: qs.get('guardiaId') || '',
  guardia: qs.get('guardia') || '',
  returnUrl: qs.get('returnUrl') || '',
  inicio: Number(qs.get('inicio') || Date.now())
};

let lecturas = [];
let scanner = null;
let scannerActivo = false;
let bloqueadoHasta = 0;
let ultimoCodigo = '';
let ultimoCodigoMs = 0;

document.getElementById('guardia').textContent = CFG.guardia || 'Velador';
document.getElementById('sessionTxt').textContent = CFG.session;

function keyLocal(){ return 'rq_' + CFG.session; }

function restaurar(){
  try{
    const raw = localStorage.getItem(keyLocal());
    if(raw){
      const x = JSON.parse(raw);
      if(Array.isArray(x)) lecturas = x;
    }
  }catch(e){}
  actualizarContador();
}

function guardarLocal(){
  try{ localStorage.setItem(keyLocal(), JSON.stringify(lecturas)); }catch(e){}
}

function actualizarContador(){
  document.getElementById('contador').textContent = lecturas.length;
  if(lecturas.length){
    const u = lecturas[lecturas.length-1];
    document.getElementById('ultimo').textContent = u.q;
    document.getElementById('ultimoHora').textContent = new Date(u.t).toLocaleTimeString();
  }
}

setInterval(() => {
  const s = Math.max(0, Math.floor((Date.now()-CFG.inicio)/1000));
  const m = Math.floor(s/60);
  const ss = s%60;
  document.getElementById('tiempo').textContent =
    String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
},1000);

async function iniciarScanner(){
  if(!CFG.session || !CFG.guardiaId || !CFG.returnUrl){
    mostrar('Faltan datos para iniciar el rondín.', 'bad');
    return;
  }
  if(typeof Html5Qrcode === 'undefined'){
    mostrar('No cargó el lector QR.', 'bad');
    return;
  }

  scanner = new Html5Qrcode('reader');

  try{
    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},
      detectado,
      () => {}
    );
    scannerActivo = true;
    mostrar('Cámara lista · Escanea el siguiente QR', 'ok');
  }catch(err){
    mostrar('No pude abrir la cámara. Revisa el permiso de cámara del navegador.', 'bad');
  }
}

function detectado(text){
  const codigo = String(text || '').trim();
  if(!codigo) return;

  const ahora = Date.now();
  if(ahora < bloqueadoHasta) return;
  if(codigo === ultimoCodigo && (ahora - ultimoCodigoMs) < 4000) return;

  bloqueadoHasta = ahora + 1200;
  ultimoCodigo = codigo;
  ultimoCodigoMs = ahora;

  lecturas.push({q:codigo,t:ahora});
  guardarLocal();
  actualizarContador();
  vibrar(120);
  mostrar('✓ QR registrado · ' + codigo, 'ok');
}

async function finalizar(){
  if(!lecturas.length){
    alert('Todavía no hay lecturas.');
    return;
  }

  if(!confirm('¿Finalizar el rondín con ' + lecturas.length + ' lecturas?')) return;

  if(scanner && scannerActivo){
    try{ await scanner.stop(); }catch(e){}
    scannerActivo = false;
  }

  mostrar('Guardando rondín...', 'ok');

  const payload = base64UrlUtf8(JSON.stringify(lecturas));

  const params = new URLSearchParams({
    action:'finishBatch',
    session:CFG.session,
    guardiaId:CFG.guardiaId,
    inicio:String(CFG.inicio),
    fin:String(Date.now()),
    payload:payload
  });

  location.href = CFG.returnUrl + '?' + params.toString();
}

function cancelar(){
  if(!confirm('¿Cancelar este rondín? Las lecturas locales se eliminarán.')) return;
  try{ localStorage.removeItem(keyLocal()); }catch(e){}
  const params = new URLSearchParams({action:'cancel'});
  location.href = CFG.returnUrl + '?' + params.toString();
}

function mostrar(txt,tipo){
  const el = document.getElementById('estado');
  el.className = 'msg' + (tipo ? ' ' + tipo : '');
  el.textContent = txt;
}

function vibrar(x){
  try{ if(navigator.vibrate) navigator.vibrate(x); }catch(e){}
}

function base64UrlUtf8(str){
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

restaurar();
iniciarScanner();
</script>
</body>
</html>
