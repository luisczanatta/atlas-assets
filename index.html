<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escáner de Rondines</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--brand:#7b135f;--brand2:#95156f;--bg:#f3f3f6;--ok:#176537;--bad:#8f211b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#222}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff}.top{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:20px}.top .small{font-size:12px;opacity:.85}.top h1{font-size:23px;margin:4px 0}.content{padding:15px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 7px 24px rgba(0,0,0,.08);margin-bottom:14px}#reader{width:100%;min-height:360px;background:#111;border-radius:18px;overflow:hidden}#reader video{object-fit:cover!important}.msg{padding:14px;border-radius:14px;margin-top:12px;background:#f3f3f5;line-height:1.4;font-size:16px;text-align:center}.msg.ok{background:#eaf7ef;color:var(--ok)}.msg.bad{background:#fdeceb;color:var(--bad)}button{width:100%;min-height:54px;border:0;border-radius:15px;font-size:16px;font-weight:bold}.finish{background:var(--brand);color:#fff}.cancel{margin-top:10px;background:#eee;color:#444}.footer{text-align:center;color:#999;font-size:12px;padding:8px 0 22px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="small">RONDÍN EN CURSO</div>
    <h1 id="guardia">—</h1>
  </div>
  <div class="content">
    <div class="card">
      <div id="reader"></div>
      <div id="estado" class="msg">Preparando cámara...</div>
    </div>
    <div class="card">
      <button class="finish" onclick="finalizar()">FINALIZAR RONDÍN</button>
      <button class="cancel" onclick="cancelar()">CANCELAR</button>
    </div>
    <div class="footer">Desarrollado por Luis Zanatta</div>
  </div>
</div>
<script>
const qs=new URLSearchParams(location.search);
const CFG={session:qs.get('session')||'',guardiaId:qs.get('guardiaId')||'',guardia:qs.get('guardia')||'',returnUrl:qs.get('returnUrl')||'',inicio:Number(qs.get('inicio')||Date.now())};
let lecturas=[],scanner=null,scannerActivo=false,bloqueadoHasta=0,ultimoCodigo='',ultimoCodigoMs=0;
document.getElementById('guardia').textContent=CFG.guardia||'Velador';
function keyLocal(){return 'rq_'+CFG.session;}
function restaurar(){try{const raw=localStorage.getItem(keyLocal());if(raw){const x=JSON.parse(raw);if(Array.isArray(x))lecturas=x;}}catch(e){}}
function guardarLocal(){try{localStorage.setItem(keyLocal(),JSON.stringify(lecturas));}catch(e){}}
async function iniciarScanner(){
  if(!CFG.session||!CFG.guardiaId||!CFG.returnUrl){mostrar('Faltan datos para iniciar el rondín.','bad');return;}
  if(typeof Html5Qrcode==='undefined'){mostrar('No cargó el lector QR.','bad');return;}
  scanner=new Html5Qrcode('reader');
  try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:260},aspectRatio:1.0},detectado,()=>{});scannerActivo=true;mostrar('Cámara lista · Escanea el siguiente QR','ok');}
  catch(err){mostrar('No pude abrir la cámara. Revisa el permiso de cámara del navegador.','bad');}
}
function detectado(text){
  const codigo=String(text||'').trim();if(!codigo)return;const ahora=Date.now();if(ahora<bloqueadoHasta)return;if(codigo===ultimoCodigo&&(ahora-ultimoCodigoMs)<4000)return;
  bloqueadoHasta=ahora+1200;ultimoCodigo=codigo;ultimoCodigoMs=ahora;lecturas.push({q:codigo,t:ahora});guardarLocal();vibrar(120);mostrar('✓ Punto registrado','ok');
}
async function finalizar(){
  if(!lecturas.length){alert('Todavía no hay lecturas.');return;}
  if(!confirm('¿Finalizar el rondín?'))return;
  if(scanner&&scannerActivo){try{await scanner.stop();}catch(e){}scannerActivo=false;}
  mostrar('Guardando rondín...','ok');
  const form=document.createElement('form');form.method='POST';form.action=CFG.returnUrl;form.style.display='none';
  const campos={action:'finishBatch',session:CFG.session,guardiaId:CFG.guardiaId,inicio:String(CFG.inicio),fin:String(Date.now()),payload:JSON.stringify(lecturas)};
  Object.entries(campos).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=v;form.appendChild(input);});
  document.body.appendChild(form);form.submit();
}
function cancelar(){if(!confirm('¿Cancelar este rondín?'))return;try{localStorage.removeItem(keyLocal());}catch(e){}const params=new URLSearchParams({action:'cancel'});location.href=CFG.returnUrl+'?'+params.toString();}
function mostrar(txt,tipo){const el=document.getElementById('estado');el.className='msg'+(tipo?' '+tipo:'');el.textContent=txt;}
function vibrar(x){try{if(navigator.vibrate)navigator.vibrate(x);}catch(e){}}
restaurar();iniciarScanner();
</script>
</body>
</html>
